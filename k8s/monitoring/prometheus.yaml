# Prometheus itself: one Deployment, one Service, and a set of flags chosen for
# a laptop rather than for a datacentre.
#
# What is NOT here is as much of the decision as what is. There is no
# Alertmanager, no node-exporter, no kube-state-metrics and no operator. The
# course needs Prometheus to collect the serving container's metrics, evaluate a
# rule and show it firing, and every one of those happens inside this single
# process. The README carries the measurement that made that the choice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ryvion-mlops
spec:
  replicas: 1
  # Recreate rather than RollingUpdate. The TSDB lives on an emptyDir and
  # Prometheus takes an exclusive lock on it; a rolling update would start the
  # new pod while the old one still held the directory. On a laptop it would
  # also mean two Prometheus processes resident at once, which is the one thing
  # this section is trying to avoid.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: ryvion-mlops
      annotations:
        # Prometheus is scraped by the static job in its own config, so it does
        # not need this to be collected. It is here so that a checksum of the
        # config is not needed to notice a config change - see the note on
        # reloading in the README.
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        # The uid the upstream image already runs as. Declared here anyway, so
        # that the emptyDir below is created owned by it - without fsGroup the
        # TSDB directory arrives root-owned and Prometheus exits with
        # "opening storage failed: lock DB directory: permission denied".
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          # Pinned, like everything else in this repository.
          image: prom/prometheus:v3.13.2
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Six hours, not fifteen days. A lab is over in an afternoon and the
            # retention window is the single biggest lever on how much memory
            # and disk this costs; the default would have it holding a
            # fortnight of a cluster that will be deleted tonight.
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
            # Lets `curl -XPOST .../-/reload` pick up an edited ConfigMap
            # without deleting the pod, which is how the alert lab changes a
            # threshold in front of an audience.
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          # /-/healthy is "the process is up" and /-/ready is "it has finished
          # loading its WAL and can answer queries" - the same split as the
          # serving container's two, from a different piece of software, which
          # is a good sign that the split is not a local invention.
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Measured rather than guessed: with the one scrape job below and six
          # hours of retention this sits at roughly 90 MiB resident. The limit
          # is set with enough headroom for a lab that generates a lot of load
          # and not enough to let a runaway query take the laptop down with it.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir, so the data dies with the pod. That is the right trade here:
        # a PersistentVolumeClaim on kind means a hostPath on a node container
        # that survives exactly as long as the cluster does anyway, at the cost
        # of a StorageClass to explain.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ryvion-mlops
spec:
  # NodePort 30090, published to the laptop by the extraPortMappings in
  # k8s/kind-cluster.yaml. A cluster created before those existed will not have
  # the mapping; `kubectl port-forward -n monitoring svc/prometheus 9090:9090`
  # reaches it either way.
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
      protocol: TCP
