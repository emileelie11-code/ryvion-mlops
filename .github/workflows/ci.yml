# The always-on quality gate.
#
# This workflow is one of two CI definitions in the repository, and the split is
# deliberate. GitHub Actions runs here because it needs no setup whatsoever: a
# student forks this repository, opens a pull request, and lint and unit tests
# run on their fork within seconds of the push. Nobody has to create an
# organisation, connect a repository or configure a service connection first.
#
# The Azure Pipelines definition in .pipelines/ is the artifact the course
# studies and extends. It runs the same two commands. Having both visible in one
# repository is what makes the "two artifacts, two systems" problem concrete
# rather than described.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          # 3.11 exactly - the version the training environment pins.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environments/dev.lock.txt

      - name: Install the locked environment
        # The lockfile, never the requirements file: CI must run the exact
        # versions that were validated, for the same reason the predecessor's
        # unpinned scikit-learn is the reason this repository exists.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/dev.lock.txt
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m flake8 .

      - name: Unit tests
        run: python -m pytest --cov=automobile --cov-report=xml --junitxml=unit-testresults.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            unit-testresults.xml
            coverage.xml
          if-no-files-found: warn
